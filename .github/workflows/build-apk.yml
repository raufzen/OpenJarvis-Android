name: Build OpenJarvis Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -name "*.apk" -type f
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} dist/ \;
          if [ -f dist/app-debug.apk ]; then
            cp dist/app-debug.apk dist/OpenJarvis-v1.2.0.apk
          fi
          if [ -f dist/app-release.apk ]; then
            cp dist/app-release.apk dist/OpenJarvis-v1.2.0-release.apk
          fi
          echo "Files in dist/:"
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-v1.2.0-APK
          path: dist/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "OpenJarvis Mobile v1.2.0 (Auto-Load Models from API Key)"
          draft: false
          prerelease: false
          files: dist/*.apk
          body: |
            # 🚀 OpenJarvis Mobile v1.2.0 — Auto Model Discovery Edition

            ### 📦 Download & Install:
            - **[OpenJarvis-v1.2.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/OpenJarvis-v1.2.0.apk)**

            ### ✨ What's New in v1.2.0:
            - 🤖 **Auto-Load Models from API Key:** The app automatically queries Google Gemini API to fetch every model supported by your API key!
            - ⚡ **Default Updated to gemini-3.8-flash:** Uses the latest available Gemini 3.8 Flash model instead of deprecated versions.
            - 🔄 **Smart Auto-Recovery:** If any model becomes unavailable, Jarvis automatically detects the recommended model and seamlessly retries without interrupting you.
            - 🎙️ **Full Voice Conversation (TTS & STT):** Talk hands-free and hear Jarvis reply!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
