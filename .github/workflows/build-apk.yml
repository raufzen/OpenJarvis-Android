name: Build OpenJarvis Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -name "*.apk" -type f
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} dist/ \;
          if [ -f dist/app-debug.apk ]; then
            cp dist/app-debug.apk dist/OpenJarvis-v1.1.0.apk
          fi
          if [ -f dist/app-release.apk ]; then
            cp dist/app-release.apk dist/OpenJarvis-v1.1.0-release.apk
          fi
          echo "Files in dist/:"
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-v1.1.0-APK
          path: dist/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "OpenJarvis Mobile v1.1.0 (Gemini 4G Standalone)"
          draft: false
          prerelease: false
          files: dist/*.apk
          body: |
            # 🚀 OpenJarvis Mobile v1.1.0 — Gemini 4G Standalone Edition

            Standalone Android AI Assistant powered directly by **Google Gemini API** (`gemini-2.5-flash`).
            **No PC, No server, and No Wi-Fi required!** Runs anywhere directly over Mobile Data (4G/5G).

            ### 📦 Download & Install:
            - **[OpenJarvis-v1.1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/OpenJarvis-v1.1.0.apk)**

            ### ✨ What's New in v1.1.0:
            - 🌟 **Google Gemini Mode (No Wi-Fi Needed):** Runs 100% standalone on 4G Mobile Data directly through Google Gemini 2.5 Flash / 2.0 Flash.
            - 🎙️ **Jarvis Voice Conversation (TTS & STT):** Talk to Jarvis using your voice and listen to Jarvis speak back replies!
            - 🔑 **Built-in API Key Setup & Testing:** Directly test and validate your Gemini API Key in seconds.
            - 💻 **Dual Mode:** Switch anytime between standalone Gemini Mode and PC OpenJarvis Server Mode.
            - 🎨 **Enhanced Cyberpunk HUD:** Reactive Arc Reactor pulsing during reasoning and speech.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
